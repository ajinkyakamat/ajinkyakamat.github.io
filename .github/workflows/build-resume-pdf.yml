name: Build website resume PDF

on:
  push:
    branches: [feat/commercial-project-media]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  pull_request:
    branches: [main]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Compile released resume with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_lualatex: true

      - name: Verify the PDF
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          pdf = Path("resume.pdf").read_bytes()
          assert pdf.startswith(b"%PDF-"), "Not a PDF"
          page_count = len(re.findall(rb"/Type\s*/Page\b", pdf))
          assert page_count == 2, f"Expected exactly 2 PDF pages, found {page_count}"
          print(f"Verified {page_count}-page PDF ({len(pdf)} bytes)")
          PY

      - name: Commit public PDF to the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/commercial-project-media'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build two-page public resume PDF"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Build website resume PDF

on:
  push:
    branches: [feat/commercial-project-media]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  pull_request:
    branches: [main]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Compile released resume with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_lualatex: true

      - name: Verify the PDF
        run: |
          test -s resume.pdf
          page_count=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          if [ "$page_count" != "2" ]; then
            echo "Expected exactly 2 pages, got $page_count" >&2
            exit 1
          fi

      - name: Commit public PDF to the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/commercial-project-media'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build two-page public resume PDF"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

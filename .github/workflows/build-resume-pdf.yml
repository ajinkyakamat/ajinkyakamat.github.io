name: Build website resume PDF

on:
  push:
    branches: [feat/commercial-project-media]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  pull_request:
    branches: [main]
    paths:
      - resume.tex
      - .github/workflows/build-resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Compile released resume with LuaLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          latexmk_use_lualatex: true

      - name: Verify the PDF
        run: |
          python3 -m venv /tmp/resume-check
          /tmp/resume-check/bin/pip install --quiet pypdf
          /tmp/resume-check/bin/python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          path = Path("resume.pdf")
          assert path.is_file() and path.stat().st_size > 0, "PDF was not generated"
          page_count = len(PdfReader(path).pages)
          assert page_count == 2, f"Expected exactly two PDF pages, found {page_count}"
          print(f"Verified two-page PDF ({path.stat().st_size} bytes)")
          PY

      - name: Commit public PDF to the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/commercial-project-media'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build two-page public resume PDF"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
